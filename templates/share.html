{% extends 'base.html' %}{% block body %}<div class="card"><h1>Poll Ready</h1><p>{{league.name}} · Fantasy {{league.sport}}</p><div class="label">Shareable Manager Link</div><input id="pollLink" class="input" value="{{link}}" readonly><div class="row"><button class="btn primary" onclick="navigator.clipboard.writeText(document.getElementById('pollLink').value)">Copy Link</button><a class="btn secondary" href="sms:?&body={{('Draft scheduling for '+league.name+' is open. Vote here: '+link)|urlencode}}">Message Text</a><a class="btn secondary" href="{{url_for('league_dashboard',league_id=league.id)}}">View Progress</a></div><p class="small muted">The same common link is used by every manager. They select their name when they open it.</p></div>{% endblock %}
