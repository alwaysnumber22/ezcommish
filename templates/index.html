  {% extends 'base.html' %}

{% block body %}

<div class="card hero">

    <h1>
        Run Your League. The <span class="preferred">EZ</span> Way.
    </h1>

    <p class="muted">
        Commissioner-first fantasy draft scheduling.
    </p>

    <form method="post" style="max-width:430px;margin:24px auto;text-align:left">

        <input
            type="hidden"
            name="_csrf_token"
            value="{{ csrf_token() }}"
        >

        <div class="label">
            Your Name
        </div>

        <input
            class="input"
            name="name"
            autocomplete="name"
            required
        >

        <div class="label">
            Mobile Number
        </div>

        <input
            class="input"
            name="phone"
            type="tel"
            autocomplete="tel"
            inputmode="tel"
            placeholder="707-555-1234"
            required
        >

        <button
            class="btn primary"
            type="submit"
            style="width:100%"
        >
            Continue
        </button>

    </form>

</div>

{% endblock %}
