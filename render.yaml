services:
  - type: web
    name: ezcommish
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ezcommish-db
          property: connectionString

databases:
  - name: ezcommish-db
    plan: basic-256mb
    databaseName: ezcommish
    user: ezcommish
